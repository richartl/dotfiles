# ============================================================
# General
# ============================================================

# Prefix: Ctrl+A
unbind C-b
unbind C-a

set -g prefix C-a
bind C-a send-prefix

# Índices desde 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode
setw -g mode-keys vi

# Mouse
set -g mouse on

# Historial grande
set -g history-limit 100000

# Vim/Neovim más responsivo
set -sg escape-time 10

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Clipboard
set -g set-clipboard on


# ============================================================
# SAFETY
# ============================================================

# ------------------------------------------------------------
# Ctrl+A d
#
# Por defecto hace detach de tmux.
# Lo deshabilitamos para evitar salir accidentalmente
# de la sesión.
# ------------------------------------------------------------

unbind d


# ------------------------------------------------------------
# Ctrl+A x
#
# Por defecto mata el pane actual.
# Lo mantenemos pero SIEMPRE pide confirmación.
# ------------------------------------------------------------

unbind x

bind x confirm-before \
  -p "Cerrar este pane? (y/n)" \
  kill-pane


# ------------------------------------------------------------
# Ctrl+A &
#
# Mata una window completa.
# Pedimos confirmación.
# ------------------------------------------------------------

unbind &

bind & confirm-before \
  -p "Cerrar esta window completa? (y/n)" \
  kill-window


# ------------------------------------------------------------
# Ctrl+A !
#
# Por defecto convierte el pane actual en una nueva window.
#
# Puede parecer que desapareció o se rompió el layout.
# Lo deshabilitamos.
# ------------------------------------------------------------

unbind !


# ============================================================
# Windows
# ============================================================

# Crear ventana conservando directorio actual
bind c new-window -c "#{pane_current_path}"

# Ctrl+A H -> ventana anterior
bind H previous-window

# Ctrl+A L -> ventana siguiente
bind L next-window


# ============================================================
# Panes / Splits
# ============================================================

# Ctrl+A "
#
# Split horizontal
#
# ┌──────────────┐
# │              │
# ├──────────────┤
# │              │
# └──────────────┘

unbind '"'

bind '"' split-window \
  -v \
  -c "#{pane_current_path}"


# Ctrl+A %
#
# Split vertical
#
# ┌───────┬───────┐
# │       │       │
# │       │       │
# └───────┴───────┘

unbind %

bind '%' split-window \
  -h \
  -c "#{pane_current_path}"


# Alternativos
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# Navegación entre panes estilo Vim
# ============================================================

# Ctrl+A h
# izquierda

bind h select-pane -L


# Ctrl+A j
# abajo

bind j select-pane -D


# Ctrl+A k
# arriba

bind k select-pane -U


# Ctrl+A l
# derecha

bind l select-pane -R


# ============================================================
# Resize fácil
# ============================================================

# Ctrl+A + Flechas
#
# Gracias a -r puedes mantener/pulsar la flecha
# repetidamente sin volver a presionar Ctrl+A.

bind -r Left \
  resize-pane -L 5

bind -r Right \
  resize-pane -R 5

bind -r Up \
  resize-pane -U 3

bind -r Down \
  resize-pane -D 3


# ============================================================
# TEMPLATE 1
#
# Ctrl+A i
#
# IDE / Desarrollo principal
#
# ┌─────────────────────────────────────┐
# │                                     │
# │            EDITOR / NVIM            │
# │                                     │
# │                                     │
# ├──────────────────┬──────────────────┤
# │                  │                  │
# │    TERMINAL 1    │    TERMINAL 2    │
# │                  │                  │
# └──────────────────┴──────────────────┘
#
# 75% editor
# 25% terminales
#
# Útil para:
#
# Neovim
# servidor dev
# tests
# comandos
# Docker
#
# Todos los panes conservan la carpeta actual.
# ============================================================

bind i \
  split-window -v -p 25 -c "#{pane_current_path}" \; \
  split-window -h -p 50 -c "#{pane_current_path}" \; \
  select-pane -U


# ============================================================
# TEMPLATE 2
#
# Ctrl+A v
#
# Editor + herramientas laterales
#
# ┌─────────────────────────┬────────────┐
# │                         │            │
# │                         │ TERMINAL 1 │
# │                         │            │
# │       EDITOR            ├────────────┤
# │                         │            │
# │                         │ TERMINAL 2 │
# │                         │            │
# └─────────────────────────┴────────────┘
#
# ~70% editor
# ~30% columna lateral
#
# Útil para:
#
# Neovim
# docker compose logs
# tests
# kubectl
# git
# ============================================================

bind v \
  split-window -h -p 30 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -L


# ============================================================
# TEMPLATE 3
#
# Ctrl+A o
#
# OPS / MONITORING
#
# ┌──────────────────┬──────────────────┐
# │                  │                  │
# │    TERMINAL 1    │    TERMINAL 2    │
# │                  │                  │
# ├──────────────────┼──────────────────┤
# │                  │                  │
# │    TERMINAL 3    │    TERMINAL 4    │
# │                  │                  │
# └──────────────────┴──────────────────┘
#
# Útil para:
#
# docker compose logs
# kubectl
# k9s
# htop
# watch
# curl
# terraform
# ansible
# ============================================================

bind o \
  split-window -h -p 50 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -L \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-layout tiled


# ============================================================
# Layouts automáticos de tmux
# ============================================================

# Ctrl+A Space
#
# Va alternando entre:
#
# even-horizontal
# even-vertical
# main-horizontal
# main-vertical
# tiled

bind Space next-layout


# ============================================================
# Copy mode estilo Vim
# ============================================================

# Ctrl+A [
#
# Entrar en copy mode

bind [ copy-mode


# v
#
# Comenzar selección

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection


# Ctrl+V
#
# Selección rectangular

bind-key -T copy-mode-vi C-v \
  send-keys -X rectangle-toggle


# y
#
# Copiar directamente al clipboard de macOS

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "pbcopy"


# ============================================================
# Reload
# ============================================================

# Ctrl+A r

bind r \
  source-file ~/.tmux.conf \; \
  display-message "☠ tmux.conf RECARGADO ☠"


# ============================================================
# ESTÉTICA FANZINE ☠
#
# Fotocopia punk: tinta negra, papel hueso y stickers de
# colores pegados encima. Bloques invertidos tipo carta de
# rescate, bordes gruesos, cero redondeces.
#
# Paleta (la misma que nvim/colors/fanzine.lua):
#   tinta   #0b0b0b   papel  #efe9dc   gris  #6b6b6b
#   rosa    #ff2a6d   ácido  #f7e600   sangre #e10600
#   xerox   #2de2e6
# ============================================================


# ============================================================
# Status bar
# ============================================================

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#0b0b0b,fg=#efe9dc"


# Izquierda: sticker amarillo con la sesión + sticker rosa "DIY"
#
#  ☠ 0  DIY
#
set -g status-left-length 40

set -g status-left \
"#[bg=#f7e600,fg=#0b0b0b,bold] ☠ #S #[bg=#ff2a6d,fg=#0b0b0b,bold] DIY #[default]  "


# Derecha: recortes pegados (usuario, hora, fecha)
#
#  ★ richartl  11:20  13·11·26
#
set -g status-right-length 100

set -g status-right \
"#[fg=#f7e600,bold]★ #(whoami) #[bg=#efe9dc,fg=#0b0b0b,bold] %H:%M #[bg=#e10600,fg=#efe9dc,bold] %d·%m·%y #[default]"


# ============================================================
# Windows - Status
# ============================================================

# Ventanas inactivas: alternan papel / fotocopia gris según el
# índice (par / impar), como letras recortadas de revistas.

setw -g window-status-separator ""

setw -g window-status-format \
"#{?#{e|%:#{window_index},2},#[bg=#efe9dc#,fg=#0b0b0b],#[bg=#2a2a2a#,fg=#efe9dc]} #I #W #[default] "


# Ventana activa: sticker rosa con tachas

setw -g window-status-current-format \
"#[bg=#ff2a6d,fg=#0b0b0b,bold] ✖ #I #W ✖ #[default] "


# Actividad en otra ventana: subrayado rojo

setw -g window-status-activity-style "fg=#e10600,bold,underscore"


# ============================================================
# Panes - Apariencia
# ============================================================

# Pane inactivo apagado (solo el texto; el fondo lo pone el
# terminal / nvim).

set -g window-style "fg=#8a8a8a"
set -g window-active-style "fg=#efe9dc"


# Bordes gruesos, como cinta de aislar

set -g pane-border-lines heavy

set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#f7e600,bold"


# ============================================================
# Información del pane
# ============================================================

# Pane activo:    ☠ 1 · nvim     (sticker amarillo)
# Pane inactivo:    2 · zsh      (gris fotocopia)

set -g pane-border-status top

set -g pane-border-format \
"#{?pane_active,#[bg=#f7e600#,fg=#0b0b0b#,bold] ☠ #{pane_index} · #{pane_current_command} ,#[fg=#6b6b6b] #{pane_index} · #{pane_current_command} }#[default]"


# ============================================================
# Mensajes, prompts y copy mode
# ============================================================

set -g message-style "bg=#ff2a6d,fg=#0b0b0b,bold"
set -g message-command-style "bg=#f7e600,fg=#0b0b0b,bold"

# Selección en copy mode: resaltador amarillo
setw -g mode-style "bg=#f7e600,fg=#0b0b0b,bold"

# Números de pane (Ctrl+A q)
set -g display-panes-active-colour "#ff2a6d"
set -g display-panes-colour "#efe9dc"

# Reloj (Ctrl+A t)
setw -g clock-mode-colour "#ff2a6d"

set -as terminal-features ",*:clipboard"
