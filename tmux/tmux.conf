# ============================================================
# General
# ============================================================

# Prefix: Ctrl+A
unbind C-b
unbind C-a

set -g prefix C-a
bind C-a send-prefix

# Índices desde 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi mode
setw -g mode-keys vi

# Mouse
set -g mouse on

# Historial grande
set -g history-limit 100000

# Vim/Neovim más responsivo
set -sg escape-time 10

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Clipboard
set -g set-clipboard on


# ============================================================
# SAFETY
# ============================================================

# ------------------------------------------------------------
# Ctrl+A d
#
# Por defecto hace detach de tmux.
# Lo deshabilitamos para evitar salir accidentalmente
# de la sesión.
# ------------------------------------------------------------

unbind d


# ------------------------------------------------------------
# Ctrl+A x
#
# Por defecto mata el pane actual.
# Lo mantenemos pero SIEMPRE pide confirmación.
# ------------------------------------------------------------

unbind x

bind x confirm-before \
  -p "Cerrar este pane? (y/n)" \
  kill-pane


# ------------------------------------------------------------
# Ctrl+A &
#
# Mata una window completa.
# Pedimos confirmación.
# ------------------------------------------------------------

unbind &

bind & confirm-before \
  -p "Cerrar esta window completa? (y/n)" \
  kill-window


# ------------------------------------------------------------
# Ctrl+A !
#
# Por defecto convierte el pane actual en una nueva window.
#
# Puede parecer que desapareció o se rompió el layout.
# Lo deshabilitamos.
# ------------------------------------------------------------

unbind !


# ============================================================
# Windows
# ============================================================

# Crear ventana conservando directorio actual
bind c new-window -c "#{pane_current_path}"

# Ctrl+A H -> ventana anterior
bind H previous-window

# Ctrl+A L -> ventana siguiente
bind L next-window


# ============================================================
# Panes / Splits
# ============================================================

# Ctrl+A "
#
# Split horizontal
#
# ┌──────────────┐
# │              │
# ├──────────────┤
# │              │
# └──────────────┘

unbind '"'

bind '"' split-window \
  -v \
  -c "#{pane_current_path}"


# Ctrl+A %
#
# Split vertical
#
# ┌───────┬───────┐
# │       │       │
# │       │       │
# └───────┴───────┘

unbind %

bind '%' split-window \
  -h \
  -c "#{pane_current_path}"


# Alternativos
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# Navegación entre panes estilo Vim
# ============================================================

# Ctrl+A h
# izquierda

bind h select-pane -L


# Ctrl+A j
# abajo

bind j select-pane -D


# Ctrl+A k
# arriba

bind k select-pane -U


# Ctrl+A l
# derecha

bind l select-pane -R


# ============================================================
# Resize fácil
# ============================================================

# Ctrl+A + Flechas
#
# Gracias a -r puedes mantener/pulsar la flecha
# repetidamente sin volver a presionar Ctrl+A.

bind -r Left \
  resize-pane -L 5

bind -r Right \
  resize-pane -R 5

bind -r Up \
  resize-pane -U 3

bind -r Down \
  resize-pane -D 3


# ============================================================
# TEMPLATE 1
#
# Ctrl+A i
#
# IDE / Desarrollo principal
#
# ┌─────────────────────────────────────┐
# │                                     │
# │            EDITOR / NVIM            │
# │                                     │
# │                                     │
# ├──────────────────┬──────────────────┤
# │                  │                  │
# │    TERMINAL 1    │    TERMINAL 2    │
# │                  │                  │
# └──────────────────┴──────────────────┘
#
# 75% editor
# 25% terminales
#
# Útil para:
#
# Neovim
# servidor dev
# tests
# comandos
# Docker
#
# Todos los panes conservan la carpeta actual.
# ============================================================

bind i \
  split-window -v -p 25 -c "#{pane_current_path}" \; \
  split-window -h -p 50 -c "#{pane_current_path}" \; \
  select-pane -U


# ============================================================
# TEMPLATE 2
#
# Ctrl+A v
#
# Editor + herramientas laterales
#
# ┌─────────────────────────┬────────────┐
# │                         │            │
# │                         │ TERMINAL 1 │
# │                         │            │
# │       EDITOR            ├────────────┤
# │                         │            │
# │                         │ TERMINAL 2 │
# │                         │            │
# └─────────────────────────┴────────────┘
#
# ~70% editor
# ~30% columna lateral
#
# Útil para:
#
# Neovim
# docker compose logs
# tests
# kubectl
# git
# ============================================================

bind v \
  split-window -h -p 30 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -L


# ============================================================
# TEMPLATE 3
#
# Ctrl+A o
#
# OPS / MONITORING
#
# ┌──────────────────┬──────────────────┐
# │                  │                  │
# │    TERMINAL 1    │    TERMINAL 2    │
# │                  │                  │
# ├──────────────────┼──────────────────┤
# │                  │                  │
# │    TERMINAL 3    │    TERMINAL 4    │
# │                  │                  │
# └──────────────────┴──────────────────┘
#
# Útil para:
#
# docker compose logs
# kubectl
# k9s
# htop
# watch
# curl
# terraform
# ansible
# ============================================================

bind o \
  split-window -h -p 50 -c "#{pane_current_path}" \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-pane -L \; \
  split-window -v -p 50 -c "#{pane_current_path}" \; \
  select-layout tiled


# ============================================================
# Layouts automáticos de tmux
# ============================================================

# Ctrl+A Space
#
# Va alternando entre:
#
# even-horizontal
# even-vertical
# main-horizontal
# main-vertical
# tiled

bind Space next-layout


# ============================================================
# Copy mode estilo Vim
# ============================================================

# Ctrl+A [
#
# Entrar en copy mode

bind [ copy-mode


# v
#
# Comenzar selección

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection


# Ctrl+V
#
# Selección rectangular

bind-key -T copy-mode-vi C-v \
  send-keys -X rectangle-toggle


# y
#
# Copiar directamente al clipboard de macOS

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel "pbcopy"


# ============================================================
# Reload
# ============================================================

# Ctrl+A r

bind r \
  source-file ~/.tmux.conf \; \
  display-message "tmux.conf reloaded"


# ============================================================
# Status bar
# ============================================================

set -g status on

set -g status-position bottom

set -g status-interval 5

set -g status-style \
  "bg=#1e1e2e,fg=#cdd6f4"


# Izquierda

set -g status-left-length 40

set -g status-left \
"#[bold,fg=#11111b,bg=#89b4fa] TMUX #[fg=#89b4fa,bg=#1e1e2e] "


# Derecha

set -g status-right-length 100

set -g status-right \
"#[fg=#6c7086]#(whoami) #[fg=#89b4fa]| #[fg=#a6e3a1]%H:%M #[fg=#89b4fa]| #[fg=#f9e2af]%d-%m-%Y "


# ============================================================
# Windows - Status
# ============================================================

# Ventana inactiva

setw -g window-status-format \
" #[fg=#6c7086]#I:#W "


# Ventana activa

setw -g window-status-current-format \
"#[fg=#11111b,bg=#a6e3a1,bold] ● #I:#W #[fg=#a6e3a1,bg=#1e1e2e]"


# ============================================================
# Panes - Apariencia
# ============================================================

# Pane inactivo ligeramente apagado
#
# No modificamos el background para evitar interferir
# con Tokyo Night / Neovim.

set -g window-style \
"fg=#6c7086"


# Pane activo más brillante

set -g window-active-style \
"fg=#cdd6f4"


# Borde de panes inactivos

set -g pane-border-style \
"fg=#45475a"


# Pane activo con borde verde brillante

set -g pane-active-border-style \
"fg=#a6e3a1,bold"


# ============================================================
# Información del pane
# ============================================================

# Mostrar información arriba de cada pane

set -g pane-border-status top


# Pane activo:
#
# ● ACTIVE 1 · nvim
#
# Pane inactivo:
#
# 2 · zsh

set -g pane-border-format \
" #[fg=#6c7086]#{?pane_active,#[fg=#a6e3a1,bold]● ACTIVE #[fg=#cdd6f4],}#{pane_index} · #{pane_current_command} #[default]"


# ============================================================
# Mensajes
# ============================================================

set -g message-style \
"bg=#313244,fg=#cdd6f4"

set -as terminal-features ",*:clipboard"
