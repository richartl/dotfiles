format = "$directory$git_branch$git_status$docker_context$kubernetes$nodejs$python$golang$java$terraform$cmd_duration$line_break$character"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"

[docker_context]
symbol = "🐳 "
style = "blue"

[kubernetes]
disabled = false
symbol = "☸️ "
style = "bold blue"
format = '[$symbol$context( $namespace)]($style) '

[nodejs]
symbol = "⬢ "

[python]
symbol = " "

[golang]
symbol = " "

[java]
symbol = " "

[terraform]
symbol = "💠 "

[cmd_duration]
min_time = 1000
format = "took [$duration](yellow) "

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
